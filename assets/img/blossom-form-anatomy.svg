<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Anatomy of a Blossom add form: date with a calendar, a beds picker with a grid icon that totals acres, dropdowns from your saved lists, notes, and Add versus Add and Clone buttons.">
  <rect x="0" y="0" width="1000" height="500" rx="16" fill="#f6faf3"/>
  <text x="500" y="40" text-anchor="middle" fill="#607d8b" font-size="14">Most <tspan font-weight="700" fill="#37474f">add forms</tspan> follow the same shape.</text>

  <!-- form card -->
  <rect x="310" y="66" width="380" height="396" rx="12" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/>

  <!-- date -->
  <text x="330" y="100" fill="#90a4ae" font-size="11">Date</text>
  <rect x="330" y="108" width="340" height="34" rx="6" fill="#ffffff" stroke="#d5dbd5"/>
  <rect x="642" y="116" width="18" height="17" rx="2" fill="none" stroke="#90a4ae" stroke-width="1.3"/>
  <line x1="642" y1="122" x2="660" y2="122" stroke="#90a4ae" stroke-width="1.3"/>

  <!-- beds -->
  <text x="330" y="162" fill="#90a4ae" font-size="11">Beds</text>
  <rect x="330" y="170" width="340" height="34" rx="6" fill="#ffffff" stroke="#d5dbd5"/>
  <text x="342" y="191" fill="#90a4ae" font-size="12">0 beds (0.00 acres)</text>
  <g fill="#90a4ae"><circle cx="646" cy="181" r="1.6"/><circle cx="652" cy="181" r="1.6"/><circle cx="658" cy="181" r="1.6"/><circle cx="646" cy="187" r="1.6"/><circle cx="652" cy="187" r="1.6"/><circle cx="658" cy="187" r="1.6"/><circle cx="646" cy="193" r="1.6"/><circle cx="652" cy="193" r="1.6"/><circle cx="658" cy="193" r="1.6"/></g>

  <!-- dropdown -->
  <text x="330" y="224" fill="#90a4ae" font-size="11">Applicator</text>
  <rect x="330" y="232" width="340" height="34" rx="6" fill="#ffffff" stroke="#d5dbd5"/>
  <path d="M646 246 l5 5 l5 -5" fill="none" stroke="#90a4ae" stroke-width="1.4"/>

  <!-- notes -->
  <text x="330" y="286" fill="#90a4ae" font-size="11">Notes</text>
  <rect x="330" y="294" width="340" height="60" rx="6" fill="#ffffff" stroke="#d5dbd5"/>

  <!-- buttons -->
  <rect x="330" y="380" width="86" height="34" rx="6" fill="#6aab3f"/>
  <text x="373" y="402" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Add</text>
  <rect x="428" y="380" width="128" height="34" rx="6" fill="#ffffff" stroke="#6aab3f" stroke-width="1.5"/>
  <text x="492" y="402" text-anchor="middle" fill="#5a962f" font-size="13" font-weight="700">Add &amp; Clone</text>

  <!-- callouts -->
  <g stroke="#b0bec5" stroke-width="1.5" fill="none">
    <line x1="292" y1="125" x2="310" y2="125"/>
    <line x1="292" y1="324" x2="310" y2="324"/>
    <line x1="712" y1="187" x2="690" y2="187"/>
    <line x1="712" y1="249" x2="690" y2="249"/>
    <line x1="712" y1="397" x2="558" y2="397"/>
  </g>
  <g fill="#6aab3f"><circle cx="310" cy="125" r="3"/><circle cx="310" cy="324" r="3"/><circle cx="690" cy="187" r="3"/><circle cx="690" cy="249" r="3"/><circle cx="558" cy="397" r="3"/></g>

  <g fill="#37474f" font-size="13" text-anchor="end">
    <text x="284" y="121" font-weight="700">Date</text>
    <text x="284" y="138" font-size="11.5" fill="#607d8b">tap the calendar</text>
    <text x="284" y="321" font-weight="700">Notes</text>
    <text x="284" y="338" font-size="11.5" fill="#607d8b">free text</text>
  </g>
  <g fill="#37474f" font-size="13" text-anchor="start">
    <text x="720" y="176" font-weight="700">Beds picker</text>
    <text x="720" y="193" font-size="11.5" fill="#607d8b">the grid icon opens it —</text>
    <text x="720" y="209" font-size="11.5" fill="#607d8b">it totals acres as you select</text>
    <text x="720" y="248" font-weight="700">Dropdowns</text>
    <text x="720" y="265" font-size="11.5" fill="#607d8b">pull from your saved lists</text>
    <text x="720" y="392" font-weight="700">Add &amp; Clone</text>
    <text x="720" y="409" font-size="11.5" fill="#607d8b">save &amp; start another</text>
  </g>
</svg>
