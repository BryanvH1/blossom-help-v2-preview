<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="100%" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="A scouting report has a header, then per-bed observations (plant, insect sweeps, traps, diseases, weeds, bee activity, images and notes), which roll up into summaries and a printable report.">
  <rect x="0" y="0" width="1000" height="470" rx="16" fill="#f6faf3"/>
  <text x="500" y="32" text-anchor="middle" fill="#607d8b" font-size="14">A scouting report captures what you find — <tspan font-weight="700" fill="#37474f">bed by bed</tspan>.</text>

  <!-- report header -->
  <rect x="380" y="52" width="240" height="78" rx="12" fill="#6aab3f"/>
  <text x="500" y="88" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Scouting report</text>
  <text x="500" y="110" text-anchor="middle" fill="#eaf5e0" font-size="12">date · scout group · weather</text>

  <!-- connector down -->
  <line x1="500" y1="130" x2="500" y2="164" stroke="#6aab3f" stroke-width="2.5"/>
  <path d="M494 164 L506 164 L500 176 Z" fill="#6aab3f"/>

  <!-- observations container -->
  <rect x="90" y="178" width="820" height="150" rx="12" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/>
  <text x="110" y="203" fill="#78909c" font-size="12" font-weight="700">Observations — recorded per bed</text>

  <g font-size="12.5" fill="#5a962f">
    <rect x="130" y="222" width="160" height="34" rx="8" fill="#e8f2df"/><text x="210" y="244" text-anchor="middle">Plant</text>
    <rect x="320" y="222" width="160" height="34" rx="8" fill="#e8f2df"/><text x="400" y="244" text-anchor="middle">Insect sweeps</text>
    <rect x="510" y="222" width="160" height="34" rx="8" fill="#e8f2df"/><text x="590" y="244" text-anchor="middle">Traps</text>
    <rect x="700" y="222" width="160" height="34" rx="8" fill="#e8f2df"/><text x="780" y="244" text-anchor="middle">Diseases</text>
    <rect x="225" y="278" width="160" height="34" rx="8" fill="#e8f2df"/><text x="305" y="300" text-anchor="middle">Weeds</text>
    <rect x="445" y="278" width="160" height="34" rx="8" fill="#e8f2df"/><text x="525" y="300" text-anchor="middle">Bee activity</text>
    <rect x="665" y="278" width="160" height="34" rx="8" fill="#e8f2df"/><text x="745" y="300" text-anchor="middle">Images &amp; notes</text>
  </g>

  <!-- connector down -->
  <line x1="500" y1="328" x2="500" y2="368" stroke="#6aab3f" stroke-width="2.5"/>
  <path d="M494 368 L506 368 L500 380 Z" fill="#6aab3f"/>

  <!-- summaries / print -->
  <rect x="350" y="382" width="300" height="72" rx="12" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/>
  <text x="500" y="414" text-anchor="middle" fill="#37474f" font-size="14" font-weight="700">Summaries · marsh comparison</text>
  <text x="500" y="436" text-anchor="middle" fill="#607d8b" font-size="12">→ Print Report</text>
</svg>
