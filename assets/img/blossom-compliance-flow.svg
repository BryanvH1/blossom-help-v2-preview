<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Compliance flow: recording one pesticide application feeds both the printed posting or REI sign and your Pesticide Use Report.">
  <rect x="0" y="0" width="1000" height="420" rx="16" fill="#f6faf3"/>

  <text x="500" y="46" text-anchor="middle" fill="#607d8b" font-size="14">Enter each application <tspan font-weight="700" fill="#37474f">once</tspan> — Blossom carries it into your compliance outputs.</text>

  <!-- source -->
  <rect x="60" y="150" width="290" height="120" rx="12" fill="#6aab3f"/>
  <text x="205" y="196" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Record a pesticide</text>
  <text x="205" y="220" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">application</text>
  <text x="205" y="245" text-anchor="middle" fill="#eaf5e0" font-size="12">date · products · beds · applicator</text>

  <!-- connectors -->
  <g stroke="#6aab3f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M350 210 H450"/>
    <path d="M450 210 V145 H548"/>
    <path d="M450 210 V305 H548"/>
  </g>
  <g fill="#6aab3f">
    <path d="M548 139 l12 6 l-12 6 Z"/>
    <path d="M548 299 l12 6 l-12 6 Z"/>
  </g>

  <!-- output: posting -->
  <rect x="562" y="90" width="378" height="110" rx="12" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/>
  <text x="586" y="130" fill="#37474f" font-size="16" font-weight="700">Print posting / REI sign</text>
  <text x="586" y="156" fill="#607d8b" font-size="12.5">Restricted-entry hours, PHI, and products —</text>
  <text x="586" y="174" fill="#607d8b" font-size="12.5">printed for the day you sprayed.</text>

  <!-- output: PUR -->
  <rect x="562" y="250" width="378" height="110" rx="12" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/>
  <text x="586" y="290" fill="#37474f" font-size="16" font-weight="700">Pesticide Use Report (PUR)</text>
  <text x="586" y="316" fill="#607d8b" font-size="12.5">Your regulatory filing — Reports →</text>
  <text x="586" y="334" fill="#607d8b" font-size="12.5">Pest Management → Pesticide Use Report.</text>
</svg>
