<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 504" width="100%" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="The Reports section is grouped by area: Beds, Nutrient Management, Pest Management, Harvest, Equipment, Water, Sanding and Tests.">
  <rect x="0" y="0" width="1000" height="504" rx="16" fill="#f6faf3"/>
  <text x="500" y="42" text-anchor="middle" fill="#607d8b" font-size="14"><tspan font-weight="700" fill="#37474f">Reports</tspan> turns your data into printable summaries — grouped by area.</text>

  <g>
    <rect x="60" y="72" width="280" height="100" rx="12" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/>
    <rect x="60" y="72" width="6" height="100" fill="#6aab3f"/>
    <text x="86" y="112" fill="#37474f" font-size="15" font-weight="700">Beds</text>
    <text x="86" y="136" fill="#607d8b" font-size="12.5">bed lists &amp; acreage</text>

    <rect x="360" y="72" width="280" height="100" rx="12" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/>
    <rect x="360" y="72" width="6" height="100" fill="#6aab3f"/>
    <text x="386" y="112" fill="#37474f" font-size="15" font-weight="700">Nutrient Management</text>
    <text x="386" y="136" fill="#607d8b" font-size="12.5">applied units &amp; coverage</text>

    <rect x="660" y="72" width="280" height="100" rx="12" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/>
    <rect x="660" y="72" width="6" height="100" fill="#6aab3f"/>
    <text x="686" y="112" fill="#37474f" font-size="15" font-weight="700">Pest Management</text>
    <text x="686" y="136" fill="#607d8b" font-size="12.5">Pesticide Use Report (PUR)</text>

    <rect x="60" y="196" width="280" height="100" rx="12" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/>
    <rect x="60" y="196" width="6" height="100" fill="#6aab3f"/>
    <text x="86" y="236" fill="#37474f" font-size="15" font-weight="700">Harvest</text>
    <text x="86" y="260" fill="#607d8b" font-size="12.5">yields &amp; deliveries</text>

    <rect x="360" y="196" width="280" height="100" rx="12" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/>
    <rect x="360" y="196" width="6" height="100" fill="#6aab3f"/>
    <text x="386" y="236" fill="#37474f" font-size="15" font-weight="700">Water</text>
    <text x="386" y="260" fill="#607d8b" font-size="12.5">floods &amp; irrigation</text>

    <rect x="660" y="196" width="280" height="100" rx="12" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/>
    <rect x="660" y="196" width="6" height="100" fill="#6aab3f"/>
    <text x="686" y="236" fill="#37474f" font-size="15" font-weight="700">Equipment</text>
    <text x="686" y="260" fill="#607d8b" font-size="12.5">maintenance history</text>
    <rect x="60" y="320" width="280" height="100" rx="12" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/>
    <rect x="60" y="320" width="6" height="100" fill="#6aab3f"/>
    <text x="86" y="360" fill="#37474f" font-size="15" font-weight="700">Sanding</text>
    <text x="86" y="384" fill="#607d8b" font-size="12.5">events &amp; annual summary</text>

    <rect x="360" y="320" width="280" height="100" rx="12" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/>
    <rect x="360" y="320" width="6" height="100" fill="#6aab3f"/>
    <text x="386" y="360" fill="#37474f" font-size="15" font-weight="700">Tests</text>
    <text x="386" y="384" fill="#607d8b" font-size="12.5">traps by year</text>
  </g>

  <text x="500" y="460" text-anchor="middle" fill="#607d8b" font-size="12.5">Open <tspan font-weight="700" fill="#37474f">Reports</tspan> in the sidebar → pick a report → choose a year → <tspan font-weight="700" fill="#37474f">Print</tspan>.</text>
</svg>
